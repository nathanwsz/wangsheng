<!doctype html>
<html lang="en">
<head>
	<title>Footprints — Wangsheng</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
	<script src="world.js"></script>
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
		html, body { height: 100%; background: #0a1428; font-family: 'Times New Roman', Times, serif; overflow: hidden; }
		#stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
		#app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; }
		#map-wrap {
			flex: 1; min-height: 0; position: relative;
			background: radial-gradient(ellipse 100% 70% at 50% 55%,
				rgba(100,60,200,0.15) 0%,
				rgba(30,60,180,0.10) 40%,
				transparent 70%);
		}
		#main-map { width: 100%; height: 100%; }

		/* footer */
		footer {
			flex-shrink: 0;
			display: flex; align-items: center;
			padding: 14px 40px;
			background: #fff;
			box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
			gap: 24px;
		}
		.legend-item {
			display: flex; align-items: center; gap: 8px;
			font-size: 12px; color: #111;
		}
		.legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
		.legend-dot.city    { background: #4dffc3; box-shadow: 0 0 5px rgba(77,255,195,0.6); }
		.legend-dot.country { background: rgba(50,110,255,0.6); border: 1px solid rgba(77,255,195,0.5); }

		/* city panel — image card */
		#city-panel {
			position: fixed; top: 24px; right: 24px; width: 240px;
			background: #fff;
			border-radius: 10px;
			overflow: hidden;
			box-shadow: 0 8px 32px rgba(0,0,0,0.4);
			transform: translateX(300px);
			transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
			pointer-events: none; z-index: 10;
		}
		#city-panel.visible { transform: translateX(0); pointer-events: auto; }

		/* image area */
		.panel-img-wrap {
			position: relative;
			width: 100%; height: 160px;
			background: #c8d0dc;
			overflow: hidden;
		}
		.panel-img-wrap img {
			width: 100%; height: 100%; object-fit: cover;
			display: block;
		}
		.panel-img-wrap .img-placeholder {
			width: 100%; height: 100%;
			display: flex; align-items: center; justify-content: center;
			color: rgba(0,0,0,0.25); font-size: 13px; letter-spacing: 0.05em;
		}
		/* city name overlay bottom-left */
		.panel-city-name {
			position: absolute; bottom: 0; left: 0;
			background: rgba(100,100,100,0.72);
			color: #fff;
			font-family: 'Times New Roman', Times, serif;
			font-size: 15px; font-weight: bold;
			padding: 5px 10px;
			backdrop-filter: blur(4px);
			max-width: 90%;
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
		}
	</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app">
	<div id="map-wrap"><div id="main-map"></div></div>
	<footer>
		<div class="legend-item"><div class="legend-dot city"></div>Visited city</div>
		<div class="legend-item"><div class="legend-dot country"></div>Visited country</div>
	</footer>
</div>

<div id="city-panel">
	<div class="panel-img-wrap">
		<div class="img-placeholder" id="panel-placeholder">Loading…</div>
		<img id="panel-img" src="" alt="" style="display:none;" />
		<div class="panel-city-name" id="panel-city-name"></div>
	</div>
</div>

<script>
// ── Starfield ────────────────────────────────────────────────
(function() {
	const canvas = document.getElementById('stars');
	const ctx = canvas.getContext('2d');
	let stars = [];
	function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
	function init() {
		stars = Array.from({length: 600}, () => ({
			x: Math.random() * canvas.width,
			y: Math.random() * canvas.height,
			r: Math.random() * 1.8 + 0.3,
			a: Math.random() * 0.85 + 0.15,
			speed: Math.random() * 0.003 + 0.0008,
			phase: Math.random() * Math.PI * 2,
			hue: Math.random() < 0.3 ? 'rgba(200,180,255,' : 'rgba(230,240,255,'
		}));
	}
	function draw(t) {
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		stars.forEach(s => {
			const a = s.a * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
			ctx.beginPath();
			ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
			ctx.fillStyle = s.hue + a + ')';
			ctx.fill();
		});
		requestAnimationFrame(draw);
	}
	resize();
	window.addEventListener('resize', () => { resize(); init(); });
	init();
	requestAnimationFrame(draw);
})();

// ── City data ────────────────────────────────────────────────
const CITIES = [
	{name:"Beijing",value:[116.3917,39.9067]},{name:"Singapore",value:[103.8198,1.3521]},
	{name:"Dallas",value:[-96.7970,32.7767]},{name:"Langkawi",value:[99.7311,6.3424]},
	{name:"Phoenix",value:[-112.0740,33.4484]},{name:"San Francisco",value:[-122.4194,37.7749]},
	{name:"Austin",value:[-97.7431,30.2672]},{name:"Orlando",value:[-81.3789,28.5384]},
	{name:"Xi'an",value:[108.9541,34.2658]},{name:"Linhai (临海)",value:[121.1449,28.8584]},
	{name:"Shanghai",value:[121.4737,31.2304]},{name:"Hong Kong",value:[114.1694,22.3193]},
	{name:"Chengde",value:[117.9634,40.9515]},{name:"Chifeng",value:[118.8889,42.2586]},
	{name:"Chengdu",value:[104.0665,30.5723]},{name:"Hangzhou",value:[120.1552,30.2741]},
	{name:"Changzhou",value:[119.9736,31.8107]},{name:"Tianjin",value:[117.1994,39.0851]},
	{name:"Dalian",value:[121.6147,38.9140]},{name:"Changsha",value:[112.9389,28.2278]},
	{name:"Wudangshan",value:[111.0103,32.3985]},{name:"Xiangyang",value:[112.1226,32.0090]},
	{name:"Wuhan",value:[114.3052,30.5928]},{name:"Chiayi",value:[120.4491,23.4801]},
	{name:"Indianapolis",value:[-86.1581,39.7684]},{name:"Newport Beach",value:[-117.9298,33.6189]},
	{name:"Seattle",value:[-122.3328,47.6061]},{name:"New Orleans",value:[-90.0715,29.9511]},
	{name:"Atlanta",value:[-84.3885,33.7501]},{name:"Bangkok",value:[100.5018,13.7563]},
	{name:"Everglades National Park",value:[-80.8987,25.2866]},{name:"Reno",value:[-119.8138,39.5296]}
];

const VISITED = ['China','United States','Singapore','Malaysia','Thailand'];

const panel      = document.getElementById('city-panel');
const panelImg   = document.getElementById('panel-img');
const panelPlaceholder = document.getElementById('panel-placeholder');
const panelCityName = document.getElementById('panel-city-name');

function showPanel(name) {
	panel.classList.add('visible');
	panelCityName.textContent = name;
	// show placeholder while loading
	panelImg.style.display = 'none';
	panelPlaceholder.style.display = 'flex';
	panelPlaceholder.textContent = 'Loading…';
	// use Wikimedia Commons via Wikipedia image API
	const query = encodeURIComponent(name);
	fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${query}`)
		.then(r => r.json())
		.then(data => {
			const url = data?.thumbnail?.source || data?.originalimage?.source;
			if (url) {
				panelImg.onload = () => {
					panelPlaceholder.style.display = 'none';
					panelImg.style.display = 'block';
				};
				panelImg.onerror = () => {
					panelPlaceholder.textContent = 'No image found';
				};
				panelImg.src = url;
			} else {
				panelPlaceholder.textContent = 'No image found';
			}
		})
		.catch(() => { panelPlaceholder.textContent = 'No image found'; });
}

echarts.registerMap('world', WORLD_GEOJSON);
const chart = echarts.init(document.getElementById('main-map'));

chart.setOption({
	backgroundColor: '#0a1428',
	geo: {
		map: 'world',
		roam: true,
		scaleLimit: { min: 0.8, max: 10 },
		center: [15, 15],
		zoom: 1.15,
		itemStyle: {
			areaColor: 'rgba(26,35,64,0.75)',
			borderColor: 'rgba(100,150,255,0.35)',
			borderWidth: 0.7,
		},
		emphasis: {
			label: { show: false },
			itemStyle: { areaColor: 'rgba(77,127,255,0.45)', borderColor: 'rgba(77,255,195,0.7)' }
		},
		regions: VISITED.map(n => ({
			name: n,
			itemStyle: { areaColor: 'rgba(50,110,255,0.55)', borderColor: 'rgba(77,255,195,0.6)', borderWidth: 1.2 },
			emphasis: { itemStyle: { areaColor: 'rgba(77,255,195,0.30)', borderColor: 'rgba(77,255,195,0.9)' } }
		}))
	},
	series: [
		{ type:'scatter', coordinateSystem:'geo', data:CITIES, symbolSize:22, silent:true, z:3,
		  itemStyle:{ color:'rgba(77,255,195,0.08)', borderColor:'transparent' } },
		{ type:'scatter', coordinateSystem:'geo', data:CITIES, symbolSize:12, silent:true, z:4,
		  itemStyle:{ color:'rgba(77,255,195,0.20)', borderColor:'transparent' } },
		{ type:'scatter', coordinateSystem:'geo', data:CITIES, symbolSize:6, z:5, name:'cities',
		  itemStyle:{ color:'#4dffc3', borderColor:'rgba(255,255,255,0.7)', borderWidth:1 },
		  emphasis:{ scale:true, itemStyle:{ color:'#fff', borderColor:'#4dffc3', borderWidth:2, shadowBlur:20, shadowColor:'#4dffc3' } },
		  tooltip:{ show:true, formatter: p => `<span style="font-size:11px;color:#4dffc3;">${p.name}</span>` }
		}
	],
	tooltip: {
		trigger: 'item',
		backgroundColor: 'rgba(12,18,40,0.92)',
		borderColor: 'rgba(120,160,255,0.2)',
		textStyle: { color:'#c8d8ff', fontSize:11 },
		extraCssText: 'backdrop-filter:blur(8px);'
	}
});

window.addEventListener('resize', () => chart.resize());
chart.on('click', { seriesName:'cities' }, p => showPanel(p.name));
chart.on('click', e => { if (e.seriesName !== 'cities') panel.classList.remove('visible'); });
</script>
</body>
</html>
